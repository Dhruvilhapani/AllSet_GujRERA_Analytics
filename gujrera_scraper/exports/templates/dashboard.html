<title>__DISTRICT__ Builder Intelligence</title>
<style>
/* Layout: one column of sections under a sticky tab bar; each section is a responsive grid of chart cards. */
:root {
  --page: #f6f6f3; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;

  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b; --none: #b9b8b0;
  --r250: #86b6ef; --r350: #5598e7; --r450: #2a78d6; --r550: #1c5cab; --r650: #104281;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --accent: #86b6ef;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --none: #5b5a55;
  --r250: #184f95; --r350: #1c5cab; --r450: #2a78d6; --r550: #3987e5; --r650: #6da7ec; color-scheme: dark; } }
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --accent: #86b6ef;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --none: #5b5a55;
  --r250: #184f95; --r350: #1c5cab; --r450: #2a78d6; --r550: #3987e5; --r650: #6da7ec; color-scheme: dark; }
* { box-sizing: border-box; }

.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
header.top { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: flex-end; justify-content: space-between; }
h1 { font-size: 26px; line-height: 1.15; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--ink-2); margin: 4px 0 0; max-width: 72ch; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px;
  border: 1px solid var(--ring); background: var(--surface); color: var(--ink-2); }
.chip b { color: var(--ink); font-weight: 600; }
.chip.partial::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.chip.full::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page);
  display: flex; gap: 4px; overflow-x: auto; padding-block: 12px 8px; margin-top: 12px; border-bottom: 1px solid var(--grid); }
nav.tabs button { font: inherit; border: 0; background: none; color: var(--ink-2); padding: 7px 12px; border-radius: 8px;
  cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--ring); font-weight: 600; }
nav.tabs button:focus-visible, .card button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
section.tab { display: grid; gap: 16px; margin-top: 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border-radius: 12px; box-shadow: 0 0 0 1px var(--ring); padding: 14px 16px; }
.kpi .l { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

.kpi .n { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 16px; }
.card { background: var(--surface); border-radius: 12px; box-shadow: 0 0 0 1px var(--ring); padding: 16px; min-width: 0; }
.card h3 { margin: 0; font-size: 15px; }
.card .def { margin: 2px 0 10px; color: var(--ink-2); font-size: 12px; }
.card .head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.card .tbtn { font: inherit; font-size: 12px; border: 1px solid var(--ring); background: none; color: var(--ink-2);
  border-radius: 6px; padding: 3px 8px; cursor: pointer; flex: none; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 8px; font-size: 12px; color: var(--ink-2); }

td.wrap { white-space: normal; min-width: 240px; }
.na { color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.tools input { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--axis); background: var(--page);
  color: var(--ink); min-width: 0; width: min(320px, 100%); }
.tools .count { color: var(--muted); font-size: 12px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; border: 1px solid var(--ring); }
.pill::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: var(--c, var(--none)); }
#tip { position: fixed; pointer-events: none; z-index: 20; background: var(--surface); color: var(--ink); border-radius: 8px;
  box-shadow: 0 0 0 1px var(--ring), 0 6px 20px rgba(0,0,0,.12); padding: 8px 10px; font-size: 12px; max-width: 280px; display: none; }
#tip b { display: block; margin-bottom: 2px; }
.note { color: var(--ink-2); font-size: 12px; }
.note li { margin-block: 2px; }
.dq { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 16px; font-size: 13px; }
.dq div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--grid); padding-block: 4px; }
.dq span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .chart rect.m, .chart path.m { transition: opacity .15s; } }
.chart .m:hover { opacity: .8; }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>__DISTRICT__ Builder Intelligence</h1>
      <p class="sub">Residential and mixed-use projects registered with GujRERA. Every figure is computed from GujRERA's
        public project records. “—” means the source does not publish the value; it is never counted as zero.</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap" id="chips"></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"></main>
</div>
<div id="tip" role="tooltip"></div>

<script>
const DATA = /*__DATA__*/null;
const $ = (s, el = document) => el.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const nf = new Intl.NumberFormat("en-IN");
const fmt = v => v === null || v === undefined || v === "" ? "—" : (typeof v === "number" ? nf.format(Math.round(v * 10) / 10) : String(v));
const pct = v => v === null || v === undefined ? "—" : `${(Math.round(v * 10) / 10).toFixed(1)}%`;
const rupees = v => { if (v == null) return "—"; if (v >= 1e7) return `₹${(v / 1e7).toFixed(2)} cr`; if (v >= 1e5) return `₹${(v / 1e5).toFixed(2)} lakh`; return `₹${nf.format(v)}`; };

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------------------------------------------------------------- tooltip
const tip = $("#tip");
function showTip(ev, html) { tip.innerHTML = html; tip.style.display = "block"; moveTip(ev); }
function moveTip(ev) { const x = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8); const y = Math.min(ev.clientY + 14, innerHeight - tip.offsetHeight - 8); tip.style.left = x + "px"; tip.style.top = y + "px"; }

  node.setAttribute("tabindex", "0"); node.addEventListener("focus", () => { const r = node.getBoundingClientRect(); showTip({ clientX: r.right, clientY: r.top }, html); }); node.addEventListener("blur", hideTip); }

// ---------------------------------------------------------------- card with chart/table toggle
function card(parent, title, def, draw, table) {
  const c = h("div", { class: "card" });
  const head = h("div", { class: "head" }, `<div><h3>${esc(title)}</h3>${def ? `<p class="def">${def}</p>` : ""}</div>`);
  const btn = h("button", { class: "tbtn", type: "button" }, "Table");
  head.appendChild(btn); c.appendChild(head);
  const chart = h("div", { class: "chart" }); const tbl = h("div", { class: "tblwrap" }); tbl.hidden = true;
  c.append(chart, tbl); parent.appendChild(c);
  draw(chart);
  if (table) { tbl.appendChild(tableEl(table.cols, table.rows, table.fmts)); btn.onclick = () => { const t = !tbl.hidden; tbl.hidden = t; chart.hidden = !t; btn.textContent = t ? "Table" : "Chart"; }; }
  else btn.remove();

}
function tableEl(cols, rows, fmts = {}) {
  const t = h("table"); const thead = h("thead"); const tr = h("tr");
  cols.forEach((c, i) => { const th = h("th", { class: typeof rows[0]?.[i] === "number" ? "num" : "" }, esc(c)); tr.appendChild(th); });
  thead.appendChild(tr); t.appendChild(thead); const tb = h("tbody");
  for (const r of rows) { const row = h("tr"); r.forEach((v, i) => { const f = fmts[i]; const td = h("td", { class: typeof v === "number" ? "num" : (String(v ?? "").length > 60 ? "wrap" : "") }); td.innerHTML = v === null || v === undefined ? '<span class="na">—</span>' : esc(f ? f(v) : (typeof v === "number" ? fmt(v) : v)); row.appendChild(td); }); tb.appendChild(row); }
  t.appendChild(tb); return t;
}
function legend(parent, items) { const l = h("div", { class: "legend" }); for (const [name, color] of items) l.appendChild(h("span", {}, `<i style="background:${color}"></i>${esc(name)}`)); parent.appendChild(l); }
// 4 gridline intervals on a "nice" step (1, 2, 2.5, 5 × 10^k); integer steps when values are counts
function niceStep(v, n = 4) { const raw = Math.max(v, 1e-9) / n; const p = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) { const s = m * p; if (s >= raw && (v < 4 || Number.isInteger(s))) return s; } return 10 * p; }
function niceMax(v) { if (v <= 0) return 4; const s = niceStep(v); return s * 4; }
function ticks(max, n = 4) { return Array.from({ length: n + 1 }, (_, i) => max * i / n); }
const trunc = (s, n) => (s = String(s ?? "—")).length > n ? s.slice(0, n - 1) + "…" : s;

// ---------------------------------------------------------------- horizontal bars (one series, or stacked two)
function hbar(div, rows, { series = [["Value", "--s1"]], valueFmt = fmt, labelW = 210, extra } = {}) {
  if (!rows.length) { div.innerHTML = '<p class="note">No data yet.</p>'; return; }
  if (series.length > 1) legend(div, series.map(([n, v]) => [n, css(v)]));
  const W = 640, rowH = 26, top = 18, H = top + rows.length * rowH + 6, x0 = labelW, x1 = W - 60;
  const tot = r => series.reduce((s, _, i) => s + (r.values[i] || 0), 0);
  const max = niceMax(Math.max(...rows.map(tot)));
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" }, div);
  for (const t of ticks(max)) { const x = x0 + (x1 - x0) * t / max; el("line", { x1: x, x2: x, y1: top - 4, y2: H - 4, stroke: css("--grid") }, svg); el("text", { x, y: 10, "text-anchor": "middle" }, svg).textContent = valueFmt(t); }
  rows.forEach((r, i) => {
    const y = top + i * rowH + 4; el("text", { x: x0 - 8, y: y + 13, "text-anchor": "end", class: "lbl" }, svg).textContent = trunc(r.label, 30);
    let acc = 0;
    series.forEach(([name, v], si) => { const val = r.values[si] || 0; if (!val) return; const w = Math.max((x1 - x0) * val / max - 2, 1);
      const rect = el("rect", { x: x0 + (x1 - x0) * acc / max, y, width: w, height: rowH - 10, rx: 4, fill: css(v), class: "m" }, svg); acc += val;
      bindTip(rect, `<b>${esc(r.label)}</b>${esc(name)}: ${valueFmt(val)}${r.tip ? "<br>" + r.tip : ""}`); });
    el("text", { x: x0 + (x1 - x0) * acc / max + 6, y: y + 12, class: "val" }, svg).textContent = r.show ?? valueFmt(acc);
  });
}

// ---------------------------------------------------------------- vertical columns (stacked) + lines
function columns(div, xs, series, { stacked = true, valueFmt = fmt } = {}) {
  legend(div, series.map(s => [s.name, css(s.color)]));
  const W = 640, H = 260, l = 44, r = 10, t = 10, b = 26, n = xs.length, bw = (W - l - r) / n;
  const tot = i => stacked ? series.reduce((s, se) => s + (se.values[i] || 0), 0) : Math.max(...series.map(se => se.values[i] || 0));
  const max = niceMax(Math.max(1, ...xs.map((_, i) => tot(i)))); const Y = v => H - b - (H - t - b) * v / max;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" }, div);
  for (const tk of ticks(max)) { el("line", { x1: l, x2: W - r, y1: Y(tk), y2: Y(tk), stroke: css("--grid") }, svg); el("text", { x: l - 6, y: Y(tk) + 4, "text-anchor": "end" }, svg).textContent = valueFmt(tk); }
  el("line", { x1: l, x2: W - r, y1: Y(0), y2: Y(0), stroke: css("--axis") }, svg);
  xs.forEach((x, i) => {
    const cx = l + bw * i; el("text", { x: cx + bw / 2, y: H - 8, "text-anchor": "middle" }, svg).textContent = x;
    let acc = 0; const w = Math.max(bw * 0.62, 2), off = (bw - w) / 2;
    series.forEach(se => { const v = se.values[i] || 0; if (!v) return; const y1 = Y(acc + v), y0 = Y(acc);
      const rect = el("rect", { x: cx + off, y: y1, width: w, height: Math.max(y0 - y1 - (acc ? 2 : 0), 1), rx: 3, fill: css(se.color), class: "m" }, svg);
      bindTip(rect, `<b>${esc(x)}</b>${series.map(s => `${esc(s.name)}: ${valueFmt(s.values[i] || 0)}`).join("<br>")}`); acc += v; });
  });
}
function lines(div, xs, series, { valueFmt = fmt } = {}) {
  legend(div, series.map(s => [s.name, css(s.color)]));
  const W = 640, H = 260, l = 44, r = 120, t = 12, b = 26;
  const max = niceMax(Math.max(1, ...series.flatMap(s => s.values))); const X = i => l + (W - l - r) * (xs.length > 1 ? i / (xs.length - 1) : 0.5); const Y = v => H - b - (H - t - b) * v / max;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" }, div);
  for (const tk of ticks(max)) { el("line", { x1: l, x2: W - r, y1: Y(tk), y2: Y(tk), stroke: css("--grid") }, svg); el("text", { x: l - 6, y: Y(tk) + 4, "text-anchor": "end" }, svg).textContent = valueFmt(tk); }
  xs.forEach((x, i) => el("text", { x: X(i), y: H - 8, "text-anchor": "middle" }, svg).textContent = x);
  const ends = [];
  series.forEach(se => { const d = se.values.map((v, i) => `${i ? "L" : "M"}${X(i)},${Y(v || 0)}`).join("");
    el("path", { d, fill: "none", stroke: css(se.color), "stroke-width": 2, "stroke-linejoin": "round" }, svg);
    const li = se.values.length - 1; el("circle", { cx: X(li), cy: Y(se.values[li] || 0), r: 4, fill: css(se.color), stroke: css("--surface"), "stroke-width": 2 }, svg);
    ends.push({ y: Y(se.values[li] || 0), text: `${se.name} ${valueFmt(se.values[li] || 0)}` }); });
  ends.sort((a, b) => a.y - b.y); for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
  ends.forEach(e => el("text", { x: W - r + 8, y: e.y + 4, class: "val" }, svg).textContent = trunc(e.text, 20));
  const cross = el("line", { y1: t, y2: H - b, stroke: css("--axis"), visibility: "hidden" }, svg);
  const hit = el("rect", { x: l, y: t, width: W - l - r, height: H - t - b, fill: "transparent" }, svg);
  hit.addEventListener("mousemove", e => { const bb = svg.getBoundingClientRect(); const px = (e.clientX - bb.left) * W / bb.width; const i = Math.max(0, Math.min(xs.length - 1, Math.round((px - l) / (W - l - r) * (xs.length - 1))));
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("visibility", "visible");
    showTip(e, `<b>${esc(xs[i])}</b>${series.map(s => `<span style="color:${css(s.color)}">●</span> ${esc(s.name)}: ${valueFmt(s.values[i] || 0)}`).join("<br>")}`); });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); hideTip(); });
}

// ---------------------------------------------------------------- donut (≤ 6 segments, labelled)
function donut(div, items) {
  const total = items.reduce((s, i) => s + i.value, 0); if (!total) { div.innerHTML = '<p class="note">No data yet.</p>'; return; }

  const S = 200, R = 90, r0 = 58, svg = el("svg", { viewBox: `0 0 ${S} ${S}`, style: "width:200px;max-width:100%;flex:none", role: "img" });

    const p = (ang, rad) => [S / 2 + rad * Math.cos(ang), S / 2 + rad * Math.sin(ang)]; const large = a2 - a > Math.PI ? 1 : 0;
    const [x1, y1] = p(a, R), [x2, y2] = p(a2, R), [x3, y3] = p(a2, r0), [x4, y4] = p(a, r0);
    const path = el("path", { d: `M${x1},${y1}A${R},${R} 0 ${large} 1 ${x2},${y2}L${x3},${y3}A${r0},${r0} 0 ${large} 0 ${x4},${y4}Z`, fill: css(it.color), class: "m" }, svg);
    bindTip(path, `<b>${esc(it.label)}</b>${fmt(it.value)} (${pct(100 * it.value / total)})`); a = a2 + (items.length > 1 ? 0.012 : 0); });

  el("text", { x: S / 2, y: S / 2 + 16, "text-anchor": "middle" }, svg).textContent = "projects";
  const lg = h("div", { style: "display:grid;gap:6px;min-width:0;flex:1" });
  items.forEach(it => lg.appendChild(h("div", { style: "display:flex;justify-content:space-between;gap:12px;font-size:12.5px" },
    `<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:${css(it.color)}"></i>${esc(it.label)}</span><span style="font-variant-numeric:tabular-nums"><b>${fmt(it.value)}</b> <span class="na">${pct(100 * it.value / total)}</span></span>`)));

// ---------------------------------------------------------------- histogram (ordinal ramp) & scatter
function histo(div, bins, { unit = "projects" } = {}) {
  const ramp = ["--r250", "--r350", "--r450", "--r550", "--r650", "--r650"];
  const W = 640, H = 220, l = 44, r = 10, t = 16, b = 26, n = bins.length, bw = (W - l - r) / n;
  const max = niceMax(Math.max(1, ...bins.map(x => x[1]))); const Y = v => H - b - (H - t - b) * v / max;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" }, div); const tot = bins.reduce((s, x) => s + x[1], 0);
  for (const tk of ticks(max)) { el("line", { x1: l, x2: W - r, y1: Y(tk), y2: Y(tk), stroke: css("--grid") }, svg); el("text", { x: l - 6, y: Y(tk) + 4, "text-anchor": "end" }, svg).textContent = fmt(tk); }
  bins.forEach(([lab, v], i) => { const x = l + i * bw + 2; el("text", { x: x + bw / 2 - 2, y: H - 8, "text-anchor": "middle" }, svg).textContent = lab;
    if (!v) return; const rect = el("rect", { x, y: Y(v), width: bw - 4, height: Y(0) - Y(v), rx: 4, fill: css(ramp[Math.min(i, ramp.length - 1)]), class: "m" }, svg);
    bindTip(rect, `<b>${esc(lab)}</b>${fmt(v)} ${unit} (${pct(100 * v / (tot || 1))})`);
    el("text", { x: x + (bw - 4) / 2, y: Y(v) - 4, "text-anchor": "middle", class: "val" }, svg).textContent = fmt(v); });
}
function scatter(div, pts) {
  if (!pts.length) { div.innerHTML = '<p class="note">No data yet.</p>'; return; }
  const W = 640, H = 320, l = 44, r = 12, t = 10, b = 34, X = v => l + (W - l - r) * v / 100, Y = v => H - b - (H - t - b) * v / 100;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" }, div);
  for (const tk of [0, 25, 50, 75, 100]) { el("line", { x1: l, x2: W - r, y1: Y(tk), y2: Y(tk), stroke: css("--grid") }, svg); el("text", { x: l - 6, y: Y(tk) + 4, "text-anchor": "end" }, svg).textContent = tk + "%";
    el("line", { x1: X(tk), x2: X(tk), y1: t, y2: H - b, stroke: css("--grid") }, svg); el("text", { x: X(tk), y: H - 18, "text-anchor": "middle" }, svg).textContent = tk + "%"; }
  el("text", { x: (W + l) / 2, y: H - 2, "text-anchor": "middle", class: "lbl" }, svg).textContent = "Construction progress (latest QPR)";
  el("text", { x: 12, y: (H - b) / 2, "text-anchor": "middle", class: "lbl", transform: `rotate(-90 12 ${(H - b) / 2})` }, svg).textContent = "Units booked";
  const done = css("--s3"), open = css("--s1");
  pts.forEach(p => el("circle", { cx: X(Math.min(p[2], 100)), cy: Y(p[3]), r: 3.5, fill: p[6] === "completed" ? done : open, "fill-opacity": 0.55 }, svg));
  const hit = el("rect", { x: l, y: t, width: W - l - r, height: H - t - b, fill: "transparent" }, svg);
  hit.addEventListener("mousemove", e => { const bb = svg.getBoundingClientRect(); const px = (e.clientX - bb.left) * W / bb.width, py = (e.clientY - bb.top) * H / bb.height;
    let best = null, bd = 1e9; for (const p of pts) { const d = (X(Math.min(p[2], 100)) - px) ** 2 + (Y(p[3]) - py) ** 2; if (d < bd) { bd = d; best = p; } }
    if (best && bd < 400) showTip(e, `<b>${esc(best[0])}</b>${esc(best[1] ?? "")}<br>Progress ${pct(best[2])} · booked ${pct(best[3])}<br>${fmt(best[4])} booked / ${fmt(best[5])} unbooked`); else hideTip(); });
  hit.addEventListener("mouseleave", hideTip);
  legend(div, [["Not completed", open], ["Completed", done]]);
}

function bigTable(parent, cols, rows, { fmts = {}, pageSize = 200, placeholder = "Search" } = {}) {
  const tools = h("div", { class: "tools" }); const inp = h("input", { type: "search", placeholder, "aria-label": placeholder, id: "q-" + Math.random().toString(36).slice(2, 8) });
  const count = h("span", { class: "count" }); tools.append(inp, count); parent.appendChild(tools);
  const wrap = h("div", { class: "tblwrap" }); parent.appendChild(wrap);
  let sortI = -1, dir = 1, view = rows;
  function render() { const q = inp.value.trim().toLowerCase(); view = q ? rows.filter(r => r.some(v => String(v ?? "").toLowerCase().includes(q))) : rows.slice();
    if (sortI >= 0) view.sort((a, b) => { const x = a[sortI], y = b[sortI]; if (x == null) return 1; if (y == null) return -1; return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * dir; });
    wrap.innerHTML = ""; const t = tableEl(cols, view.slice(0, pageSize), fmts); wrap.appendChild(t);
    t.querySelectorAll("th").forEach((th, i) => { th.onclick = () => { dir = sortI === i ? -dir : -1; sortI = i; render(); }; if (i === sortI) th.textContent += dir > 0 ? " ▲" : " ▼"; });
    count.textContent = `${nf.format(view.length)} rows${view.length > pageSize ? ` · showing first ${pageSize} (search or sort to narrow)` : ""}`; }
  inp.addEventListener("input", render); render();
}
